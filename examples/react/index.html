<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>declarative-tracker · react</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 0 1rem 40vh;
      }
      section {
        padding: 2rem 0;
        border-bottom: 1px solid #ddd;
      }
      .hero {
        min-height: 60vh;
        display: grid;
        place-items: center;
        background: #f4f4f5;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
      }
      .grid button {
        padding: 2rem 1rem;
      }
      .spacer {
        height: 120vh;
        display: grid;
        place-items: center;
        color: #888;
      }
      #log {
        position: fixed;
        right: 0;
        bottom: 0;
        width: 26rem;
        max-height: 40vh;
        overflow: auto;
        margin: 0;
        padding: 0.75rem;
        background: #111;
        color: #9ae6b4;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
